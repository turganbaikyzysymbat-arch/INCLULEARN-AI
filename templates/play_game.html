{% extends "base.html" %}
{% block content %}
<section class="page-wrap ai-tool-form-page">
    <div class="page-heading">
        <span class="eyebrow">INCLUDELEARN AI · STUDENT GAME</span>
        <h1>{{ game.title }}</h1>
        <p>{{ game_info.subject }} · {{ game_info.grade }}-сынып</p>
    </div>

    <div class="ai-result-card">
        <div id="game-questions"></div>
        <div id="game-result" hidden></div>
    </div>
</section>

<script>
const gameData = {{ game | tojson }};
const box = document.getElementById("game-questions");
const result = document.getElementById("game-result");
let current = 0;
let score = 0;
let answered = false;

function showQuestion() {
    answered = false;
    const q = gameData.questions[current];
    box.innerHTML = "";

    const heading = document.createElement("h3");
    heading.textContent = `Сұрақ ${current + 1} / ${gameData.questions.length}`;
    box.appendChild(heading);

    const question = document.createElement("p");
    question.textContent = q.question;
    box.appendChild(question);

    q.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "secondary-btn";
        button.style.display = "block";
        button.style.width = "100%";
        button.style.margin = "10px 0";
        button.textContent = option;
        button.addEventListener("click", () => checkAnswer(index));
        box.appendChild(button);
    });

    const feedback = document.createElement("p");
    feedback.id = "feedback";
    box.appendChild(feedback);

    const next = document.createElement("button");
    next.type = "button";
    next.className = "primary-btn";
    next.textContent = current === gameData.questions.length - 1
        ? "Нәтижені көру" : "Келесі сұрақ →";
    next.disabled = true;
    next.id = "next-question";
    next.addEventListener("click", () => {
        current++;
        if (current < gameData.questions.length) showQuestion();
        else showResult();
    });
    box.appendChild(next);
}

function checkAnswer(index) {
    if (answered) return;
    answered = true;

    const q = gameData.questions[current];
    const correct = index === q.answer;
    if (correct) score++;

    const buttons = box.querySelectorAll("button.secondary-btn");
    buttons.forEach((button, i) => {
        button.disabled = true;
        if (i === q.answer) button.style.border = "2px solid #269b68";
        else if (i === index) button.style.border = "2px solid #d65b5b";
    });

    document.getElementById("feedback").textContent =
        (correct ? "Дұрыс жауап! " : "Қате жауап. Дұрыс жауап: " + q.options[q.answer] + ". ")
        + (q.explanation || "");

    document.getElementById("next-question").disabled = false;
}

function showResult() {
    box.hidden = true;
    result.hidden = false;
    result.innerHTML = "";

    const heading = document.createElement("h2");
    heading.textContent = "Ойын аяқталды!";

    const scoreText = document.createElement("p");
    scoreText.textContent = `Сіздің нәтижеңіз: ${score} / ${gameData.questions.length}`;

    const retry = document.createElement("button");
    retry.type = "button";
    retry.className = "primary-btn";
    retry.textContent = "Қайта ойнау";
    retry.addEventListener("click", () => {
        current = 0;
        score = 0;
        box.hidden = false;
        result.hidden = true;
        showQuestion();
    });

    result.append(heading, scoreText, retry);
}

showQuestion();
</script>
{% endblock %}
